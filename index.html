<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manga Reader TH — เว็บไทยล้วน</title>
<style>body{font-family:system-ui;margin:0;background:#111;color:#eee}header{padding:4px 8px;background:#1c1c1c;position:sticky;top:0;z-index:10}header h2{font-size:14px;margin:2px 0}header h2 small{font-size:10px}input,select,button{padding:5px 6px;margin:2px;font-size:13px;border-radius:8px;border:1px solid #333;background:#222;color:#eee}button{cursor:pointer}button:hover{background:#333}#status{font-size:13px;color:#8f8;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}.card{background:#1c1c1c;border-radius:10px;overflow:hidden;cursor:pointer}.card img{width:100%;height:200px;object-fit:cover;background:#000}.card div{padding:6px;font-size:13px}#reader img{max-width:800px;width:100%;display:block;margin:0 auto;background:#000}.badge{font-size:11px;background:#2a7;color:#fff;border-radius:6px;padding:2px 6px;margin-right:4px}.src{font-size:11px;background:#753;color:#fff;border-radius:6px;padding:2px 6px;margin-right:4px}#floatNav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(20,20,20,.95);border-top:1px solid #333;padding:8px;text-align:center}body.reading{padding-bottom:60px}body.reading header{display:none}</style></head><body>
<div id="floatNav">🏠 <button id="fHome">โฮม</button> <button id="fPrev">◀</button> <select id="fSel" style="max-width:170px"></select> <button id="fNext">▶</button> <button id="fTop">⬆</button></div>
<header><h2><a href="#" id="homeLink" style="color:#eee;text-decoration:none">📚 Manga Reader TH (เว็บไทย)</a> <small style="font-size:11px;color:#8f8">v12.4 อ่านสบาย 🇹🇭</small></h2>
<div>
<button id="btnHome" style="font-size:15px">🏠 โฮม</button>
<button id="btnBack" style="display:none">◀ กลับสารบัญ</button>
<select id="origin">
<option value="all">🌏 รวมทั้งหมด JP+KR+CN</option>
<option value="manga">🇯🇵 ญี่ปุ่น Manga</option>
<option value="manhwa">🇰🇷 เกาหลี Manhwa</option>
<option value="manhua">🇨🇳 จีน Manhua</option>
</select>
<select id="src" title="แหล่งเดียว: Oremanga">
<option value="oremanga">Oremanga</option>
</select>
<input id="q" placeholder="ค้นหาเรื่อง..."><button id="btnSearch">ค้นหา</button>
<button id="btnPop">ยอดนิยม</button><div id="status"></div></div></header>
<div id="list" class="grid"></div><div id="chapters" style="padding:12px"></div><div id="reader"></div>
<script>
const $=id=>document.getElementById(id);
const status=m=>{$('status').textContent=m};
const BASE={oremanga:'https://www.oremanga.net',nekopost:'https://www.nekopost.net',niceoppai:'https://www.niceoppai.net'};
const IMGERR=`onerror="this.onerror=null;this.src='https://images.weserv.nl/?url='+encodeURIComponent(this.src.replace(/^https?:\\/\\//,''))"`;
function imgTag(s){return `<img loading="lazy" src="${s}" referrerpolicy="no-referrer" ${IMGERR}>`}
function base(){return BASE[$('src').value]||BASE.oremanga}
async function viaJina(url){
  // ดึงผ่าน Jina Reader (มี CORS + ไม่โดนบล็อก) ได้ markdown กลับมา
  const r=await fetch('https://r.jina.ai/'+url);
  if(!r.ok)throw new Error('Jina '+r.status);
  return await r.text();
}
// แยกโฆษณาพนันออก: เอาเฉพาะลิงก์ /series/ + ปกจริง (ไม่ใช่ banner/cdend/gif)
function parseCards(md){
  // แยกด้วยการตัด string ล้วน (เลี่ยง regex literal เพี้ยนในบางเบราว์เซอร์)
  const out=[],seen=new Set();
  const parts=md.split('![Image');
  for(let k=1;k<parts.length;k++){
    const p=parts[k];
    // ปก: ](coverURL)
    let a=p.indexOf('](');if(a<0)continue;
    let b=p.indexOf(')',a);if(b<0)continue;
    const cover=p.slice(a+2,b);
    if(cover.indexOf('http')!==0)continue;
    if(/cdend|banner|gif|logo|avatar/i.test(cover))continue;
    // ลิงก์ series: หา ]( ... /series/ ... ) ถัดไป
    const si=p.indexOf('/series/',b);if(si<0)continue;
    let ls=p.lastIndexOf('](',si);if(ls<0)continue;
    let le=p.indexOf(')',si);if(le<0)continue;
    let link=p.slice(ls+2,le).split(/\s/)[0].replace(/\/$/,'');
    if(seen.has(link))continue;
    seen.add(link);
    const mid=p.slice(b,ls);
    const gm=mid.match(/\/genre\/([a-z]+)/i);
    // ชื่อ: จาก "title" ในลิงก์ หรือข้อความระหว่าง
    let title='';
    const qm=p.slice(ls,le+1).match(/"([^"]+)"/);
    if(qm)title=qm[1].trim();
    if(!title){
      const tm=mid.replace(/\[.*?\)/g,'').trim().match(/^[\d.\s]*([^[\]]{3,80})/);
      if(tm)title=tm[1].trim();
    }
    if(!title||/^Image\s*\d*$/i.test(title))title=link.split('/').pop();
    out.push({title,cover,link,genreInline:gm?gm[1].toLowerCase():''});
  }
  return out;
}
function genreOf(md,link){
  // หาบรรทัด genre ใต้การ์ด (เช่น [Action](.../genre/action/), [Manhwa](...))
  const i=md.indexOf(link);
  if(i<0)return '';
  const seg=md.slice(i,i+1200);
  const gs=[...seg.matchAll(/\[([A-Za-zก-๙ ]+)\]\(https:[^)]+\/genre\/([^)]+?)\)/g)].map(x=>x[2].toLowerCase());
  return gs.join(' ');
}
function originBadge(g){
  if(g.includes('manhwa'))return '🇰🇷 เกาหลี';
  if(g.includes('manhua'))return '🇨🇳 จีน';
  if(g.includes('manga'))return '🇯🇵 ญี่ปุ่น';
  return '🌏 รวม';
}
async function runSearchOrPop(mode){
  const b=base();
  try{
    let md,items;
    if(mode==='pop'){
      status('กำลังโหลดยอดนิยมจาก '+$('src').selectedOptions[0].text+' ...');
      md=await viaJina(b+'/');
    }else{
      const q=$('q').value.trim();
      if(!q)return status('พิมพ์ชื่อเรื่องก่อน เช่น โซโล่ / Solo Leveling / One Piece');
      status('กำลังค้นหา "'+q+'" ...');
      md=await viaJina(b+'/?s='+encodeURIComponent(q));
    }
    items=parseCards(md);
    // เติม genre + กรองตามชาติ
    const v=$('origin').value;
    items=items.map(c=>({...c,genre:c.genreInline||genreOf(md,c.link+'/'),badge:''}));
    items.forEach(c=>c.badge=originBadge(c.genre));
    if(v!=='all')items=items.filter(c=>c.genre.includes(v));
    if(!items.length){$('list').innerHTML='<p>ไม่เจอเรื่อง (ลองเปลี่ยนเว็บต้นทาง หรือคำค้น)</p>';status('ไม่เจอ — ลองเปลี่ยนเว็บ/คำค้น');return}
    status((mode==='pop'?'ยอดนิยม':'ค้นหา')+' — เจอ '+items.length+' เรื่อง (แตะปกเพื่ออ่าน)');
    renderCards(items);
  }catch(e){status('โหลดไม่ได้: '+e.message+' — ลองกดอีกครั้ง')}
}
function renderCards(items){
  const el=$('list');el.innerHTML='';$('chapters').innerHTML='';
  for(const c of items){
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<img loading="lazy" src="${c.cover}" referrerpolicy="no-referrer" ${IMGERR}><div><span class="badge">${c.badge}</span><span class="src">${$('src').value}</span><br>${c.title}</div>`;
    d.onclick=()=>openSeries(c.link,c.title);
    el.appendChild(d);
  }
}
async function openSeries(link,title){
  const b=base();
  const slug=link.split('/').pop();
  status('กำลังเปิด "'+title+'" ...');
  try{
    const md=await viaJina(link+'/');
    // หาลิงก์ตอน: /<slug>/<slug>-N/
    const re=new RegExp('https?://[^)\\s]+?/'+slug.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-'+'[^)\\s/]*/?','g');
    const found=[...new Set([...md.matchAll(re)].map(x=>x[0].replace(/\/$/,'')))];
    // เรียงตามเลขตอน
    const num=u=>{const m=u.match(/-(\d+)\/?$/);return m?+m[1]:-1};
    found.sort((a,c)=>num(c)-num(a));
    if(!found.length){$('chapters').innerHTML=`<h3>${title}</h3><p>ไม่เจอสารบัญ — <a target="_blank" rel="noopener" href="${link}/"><button>เปิดที่เว็บต้นทาง</button></a></p>`;status('ไม่เจอตอน');return}
    window._feed=found;window._title=title;
    $('chapters').innerHTML=`<h3>${title} — ${found.length} ตอน (แตะเพื่ออ่าน ไม่มีโฆษณา)</h3>`+
      found.map((u,i)=>{const m=u.match(/-(\d+)\/?$/);return `<button data-ch="${i}">ตอนที่ ${m?m[1]:'?'}</button>`}).join('')+
      `<div style="margin-top:8px"><a target="_blank" rel="noopener" href="${link}/"><button>เปิดที่เว็บต้นทาง</button></a></div>`;
    $('chapters').querySelectorAll('button[data-ch]').forEach(x=>x.onclick=()=>openChapter(+x.dataset.ch));
    openChapter(0);
  }catch(e){$('chapters').innerHTML=`<h3>${title}</h3><p>เปิดไม่ได้: ${e.message}</p><a target="_blank" rel="noopener" href="${link}/"><button>เปิดที่เว็บต้นทาง</button></a>`}
}
async function openChapter(i){
  const u=window._feed[i];window._idx=i;
  const box=$('reader');box.innerHTML='กำลังโหลดภาพ...';
  try{
    status('กำลังโหลดภาพตอน...');
    const md=await viaJina(u+'/');
    // เก็บ ![Image](url) ด้วย string ops
    let imgs=[];
    const ip=md.split('![Image');
    for(let k=1;k<ip.length;k++){
      const q=ip[k];
      const x=q.indexOf('](');if(x<0)continue;
      const y=q.indexOf(')',x);if(y<0)continue;
      const s=q.slice(x+2,y).split(/\s/)[0];
      if(s.indexOf('http')===0)imgs.push(s);
    }
    // ตัดโฆษณา: เอาเฉพาะภาพเนื้อเรื่อง (img.ต้นทาง / uploads เนื้อเรื่อง ไม่ใช่ banner/gif/cdend)
    imgs=[...new Set(imgs)].filter(s=>!/cdend|banners?|gif|\.gif|logo|avatar/i.test(s));
    if(!imgs.length)throw new Error('ไม่มีภาพในตอนนี้');
    const prev=i>0?`<button id="btnPrev">◀ ตอนก่อนหน้า</button>`:'';
    const next=i<window._feed.length-1?`<button id="btnNext">ตอนถัดไป ▶</button>`:'';
    const opts=window._feed.map((u2,j)=>{const m2=u2.match(/-(\d+)\/?$/);return `<option value="${j}"${j===i?' selected':''}>ตอนที่ ${m2?m2[1]:j+1}</option>`}).join('');
    box.innerHTML=`<div style="text-align:center;padding:8px;position:sticky;top:60px;background:#111">${prev}<select id="chSel" style="max-width:170px">${opts}</select><b> (${i+1}/${window._feed.length}) </b>${next}</div>`+
      imgs.map(s=>imgTag(s)).join('');
    $('chSel').onchange=e=>openChapter(+e.target.value);
    syncFloat(i);
    if(i>0)$('btnPrev').onclick=()=>openChapter(i-1);
    if(i<window._feed.length-1)$('btnNext').onclick=()=>openChapter(i+1);
    status('โหลดภาพสำเร็จ: '+imgs.length+' หน้า (บล็อกโฆษณาแล้ว)');
    $('btnBack').style.display='';
    box.scrollIntoView();
  }catch(e){box.innerHTML='โหลดภาพไม่ได้: '+e.message+' <a target="_blank" rel="noopener" href="'+u+'/"><button>เปิดที่เว็บต้นทาง</button></a>';status('อ่านไม่ได้: '+e.message)}
}
function syncFloat(i){
  // แถบลอยล่างจอ: เห็นและกดได้เสมอแม้เลื่อนลงลึก
  document.body.classList.add('reading');
  const fn=$('floatNav');fn.style.display='block';
  $('fPrev').disabled=i<=0;
  $('fNext').disabled=i>=window._feed.length-1;
  $('fSel').innerHTML=window._feed.map((u2,j)=>{const m2=u2.match(/-(\d+)\/?$/);return `<option value="${j}"${j===i?' selected':''}>ตอนที่ ${m2?m2[1]:j+1} (${j+1}/${window._feed.length})</option>`}).join('');
  $('fSel').value=String(i);
}
$('fSel').onchange=e=>openChapter(+e.target.value);
$('fPrev').onclick=()=>{if(window._idx>0)openChapter(window._idx-1)};
$('fNext').onclick=()=>{if(window._idx<window._feed.length-1)openChapter(window._idx+1)};
$('fTop').onclick=()=>window.scrollTo(0,0);
$('fHome').onclick=()=>goHome();
$('btnSearch').onclick=()=>runSearchOrPop('search');
$('btnPop').onclick=()=>runSearchOrPop('pop');
function goHome(){$('reader').innerHTML='';$('btnBack').style.display='none';$('floatNav').style.display='none';document.body.classList.remove('reading');runSearchOrPop('pop');window.scrollTo(0,0)}
$('btnHome').onclick=goHome;
$('homeLink').onclick=e=>{e.preventDefault();goHome()};
$('btnBack').onclick=()=>{$('reader').innerHTML='';$('chapters').scrollIntoView()};
$('q').onkeydown=e=>{if(e.key==='Enter')runSearchOrPop('search')};
$('src').onchange=()=>runSearchOrPop('pop');
$('origin').onchange=()=>runSearchOrPop('pop');
runSearchOrPop('pop');
</script></body></html>
