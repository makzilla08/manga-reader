const IMGERR=`onerror="this.onerror=null;this.src='https://images.weserv.nl/?url='+encodeURIComponent(this.src.replace(/^https?:\\/\\//,''))"`;
function imgTag(s,loading='lazy'){return `<img loading="${loading}" src="${s}" referrerpolicy="no-referrer" ${IMGERR}>`}
function base(){return BASE[$('src').value]||BASE.oremanga}
async function viaJina(url){
  // ดึงผ่าน Jina Reader (มี CORS + ไม่โดนบล็อก) ได้ markdown กลับมา
  const r=await fetch('https://r.jina.ai/'+url);
  if(!r.ok)throw new Error('Jina '+r.status);
  return await r.text();
}
async function viaWorker(url){
  // ดึง raw HTML ผ่าน Cloudflare worker (มี CORS *) — สำหรับ dark-manga / manga-lc
  const r=await fetch(WORKER+encodeURIComponent(url));
  if(!r.ok)throw new Error('Worker '+r.status);
  return await r.text();
}
function doc(html){return new DOMParser().parseFromString(html,'text/html')}
function isChallenge(html){return /just a moment|performing security verification|captcha/i.test(html||'')}
function absUrl(href,b){try{const u=new URL(href,b);if(u.protocol!=='http:'&&u.protocol!=='https:')return '';return u.toString().replace(/\/$/,'')}catch{return ''}}
// --- oremanga (หน้าแรก .flexbox-item=ติดเทรนด์ 6 + .flexbox4-item=มาใหม่ 36 / หมวด .flexbox2-item) ---
function parseOreCards(html,b,badge){
  const d=doc(html),out=[],seen=new Set();
  const badgeOf=a=>{
    const t=a.querySelector('.type');
    if(t){const x=t.textContent.trim().toLowerCase();
      if(x.includes('manhwa'))return '🇰🇷 เกาหลี';
      if(x.includes('manhua'))return '🇨🇳 จีน';
      if(x.includes('manga'))return '🇯🇵 ญี่ปุ่น';}
    return badge||'🌏 รวม';
  };
  d.querySelectorAll('.flexbox-item a[href*="/series/"], .flexbox2-item a[href*="/series/"], .flexbox4-thumb a[href*="/series/"]').forEach(a=>{
    const link=absUrl(a.getAttribute('href'),b+'/');if(!link||seen.has(link))return;seen.add(link);
    const img=a.querySelector('img');
    const cover=img?(img.getAttribute('src')||''):'';
    if(/cdend|banner|gif|logo|avatar/i.test(cover))return;
    const title=(a.getAttribute('title')||a.textContent||'').trim().slice(0,120)||link.split('/').pop();
    out.push({title,cover,link,genre:'',badge:badgeOf(a)});
  });
  return out;
}
function parseOreChapters(html,slug){
  const re=new RegExp('https?://[^"\\s<>]+?/'+slug.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-'+'[^"\\s<>/]*/?','g');
  const found=[...new Set([...html.matchAll(re)].map(x=>x[0].replace(/\/$/,'')))];
  const num=u=>{const m=u.match(/-(\d+)\/?$/);return m?+m[1]:-1};
  found.sort((a,c)=>num(c)-num(a));
  return found;
}
function parseOreImages(html){
  const d=doc(html),out=[];
  d.querySelectorAll('img').forEach(img=>{
    const s=img.getAttribute('src')||'';
    if(s.indexOf('https://img.oremanga.net/')===0)out.push(s);
  });
  return [...new Set(out)];
}
// manga-list A-Z: .mangalist-blc li (ลิงก์ตัวอักษร ไม่มีปก) — badge จาก class li
function parseOreList(html,b){
  const d=doc(html),out=[],seen=new Set();
  d.querySelectorAll('.mangalist-blc li').forEach(li=>{
    const a=li.querySelector('a.series[href*="/series/"]');
    if(!a)return;
    const link=absUrl(a.getAttribute('href'),b+'/');if(!link||seen.has(link))return;seen.add(link);
    const title=(a.textContent||'').trim().slice(0,120)||link.split('/').pop();
    const cls=(li.getAttribute('class')||'').toLowerCase();
    const badge=cls.includes('manhwa')?'🇰🇷 เกาหลี':cls.includes('manhua')?'🇨🇳 จีน':cls.includes('manga')?'🇯🇵 ญี่ปุ่น':'🌏 รวม';
    out.push({title,cover:'',link,genre:'',badge});
  });
  return out;
}
const PAGE_SIZE=25;
// --- dark-manga (Ts theme) ---
function parseDarkCards(html,b){
  const d=doc(html),out=[],seen=new Set();
  const badgeOf=a=>{
    const root=a.closest('.uta, .bsx')||a;
    const t=root.querySelector('.typename');
    if(t){const x=t.textContent.trim().toLowerCase();
      if(x.includes('manhwa'))return '🇰🇷 เกาหลี';
      if(x.includes('manhua'))return '🇨🇳 จีน';
      if(x.includes('manga'))return '🇯🇵 ญี่ปุ่น';}
    return '🌏 รวม';
  };
  d.querySelectorAll('.bsx a[title], .listupd .bsx a[title], .uta a.series[title]').forEach(a=>{
    const link=absUrl(a.getAttribute('href'),b+'/');if(!link||seen.has(link))return;seen.add(link);
    const img=a.querySelector('img');
    let cover=img?(img.getAttribute('data-wpfc-original-src')||img.getAttribute('data-src')||img.getAttribute('src')||''):'';
    if(cover.indexOf('data:')===0)cover='';
    const title=(a.getAttribute('title')||a.textContent||'').trim()||link.split('/').pop();
    out.push({title,cover,link,genre:'',badge:badgeOf(a)});
  });
  return out;
}
function parseDarkChapters(html,b){
  const d=doc(html),out=[],seen=new Set();
  d.querySelectorAll('.eplister a, #chapterlist a').forEach(a=>{
    const link=absUrl(a.getAttribute('href'),b+'/');if(!link||seen.has(link))return;seen.add(link);
    out.push(link);
  });
  return out;
}
function parseDarkImages(html){
  // ts_reader.run({..., sources:[{images:[...]}]})
  const m=html.match(/"images"\s*:\s*(\[[^\]]*\])/);
  if(!m)return [];
  try{
    const arr=JSON.parse(m[1].replace(/'/g,'"'));
    return [...new Set(arr)].filter(s=>/^https?:\/\//.test(s)&&!/banner|gif|logo|avatar/i.test(s));
  }catch{return []}
}
// --- manga-lc ---
function parseLcCards(html,b){
  const d=doc(html),out=[],seen=new Set();
  d.querySelectorAll('a[href*="/manga/"]').forEach(a=>{
    const href=a.getAttribute('href')||'';
    if(!/\/manga\/[^/]+\/?$/.test(href))return;
    const link=absUrl(href,b+'/');if(!link||seen.has(link))return;
    if(/genres?|genre|category|tag/.test(link))return;
    seen.add(link);
    const card=a.closest('article, .bs, .item, li, div');
    const img=(card?card.querySelector('img'):a.querySelector('img'));
    const cover=img?(img.getAttribute('data-src')||img.getAttribute('src')||''):'';
    const title=(a.getAttribute('title')||a.textContent||'').trim().slice(0,120)||link.split('/').pop();
    if(!cover&&title.length<2)return;
    out.push({title,cover,link,genre:'',badge:'🌏 รวม'});
  });
  return out.slice(0,60);
}
function parseLcChapters(html,b,slug){
  const d=doc(html),out=[],seen=new Set();
  const pick=(sel)=>{
    d.querySelectorAll(sel).forEach(a=>{
      const link=absUrl(a.getAttribute('href'),b+'/');if(!link||seen.has(link))return;
      seen.add(link);out.push(link);
    });
  };
  pick('ul.list-chap a, ul.volumns a, .list-chapter a, .chapter-list a');
  if(out.length)return out;
  d.querySelectorAll('a[href*="'+slug+'"]').forEach(a=>{
    const href=a.getAttribute('href')||'';
    if(!/ตอนที่|chapter|ch[-_]?\.?\d/i.test(href+a.textContent))return;
    const link=absUrl(href,b+'/');if(!link||seen.has(link))return;seen.add(link);
    out.push(link);
  });
  return out;
}
function parseLcImages(html){
  const d=doc(html),out=[];
  d.querySelectorAll('img[data-src], .reading-content img, #readerarea img, .entry-content img').forEach(img=>{
    const s=img.getAttribute('data-src')||img.getAttribute('src')||'';
    if(/^https?:\/\//.test(s)&&/mangaclaw|manga-lc|uploads|chapter/i.test(s))out.push(s);
  });
  const uniq=[...new Set(out)].filter(s=>!/banner|gif|logo|avatar/i.test(s));
  // ภาพเนื้อเรื่อง LC ไม่ได้อยู่ใน HTML (โหลดผ่าน JS) — ถ้าเหลือแต่ไฟล์ site-asset ถือว่าไม่มีเนื้อเรื่อง
  const content=uniq.filter(s=>/mangaclaw|mkklcdn|chapter|manga\/[^/]+\/\d/i.test(s)||!/manga-lc\.net/.test(s));
  if(content.length)return content;
  if(uniq.some(s=>/mangaclaw|mkklcdn/i.test(s)))return uniq;
  return [];
  // fallback: data-src ใดๆ ที่เป็นรูปเนื้อเรื่อง
  const all=[...d.querySelectorAll('img')].map(i=>i.getAttribute('data-src')||i.getAttribute('src')||'')
    .filter(s=>/^https?:\/\//.test(s)&&/\.(jpg|jpeg|png|webp)/i.test(s)&&!/banner|gif|logo|avatar|cover/i.test(s));
  return [...new Set(all)];
}
function parseCards(md){
  // แยกด้วยการตัด string ล้วน (เลี่ยง regex literal เพี้ยนในบางเบราว์เซอร์)
  const out=[],seen=new Set();
  const parts=md.split('![Image');
  for(let k=1;k<parts.length;k++){
    const p=parts[k];
    // ปก: ](coverURL)
    let a=p.indexOf('](');if(a<0)continue;
    let b=p.indexOf(')',a);if(b<0)continue;
    const cover=p.slice(a+2,b);
    if(cover.indexOf('http')!==0)continue;
    if(/cdend|banner|gif|logo|avatar/i.test(cover))continue;
    // ลิงก์ series: หา ]( ... /series/ ... ) ถัดไป
    const si=p.indexOf('/series/',b);if(si<0)continue;
    let ls=p.lastIndexOf('](',si);if(ls<0)continue;
    let le=p.indexOf(')',si);if(le<0)continue;
    let link=p.slice(ls+2,le).split(/\s/)[0].replace(/\/$/,'');
    if(seen.has(link))continue;
    seen.add(link);
    const mid=p.slice(b,ls);
    const gm=mid.match(/\/genre\/([a-z]+)/i);
    // ชื่อ: จาก "title" ในลิงก์ หรือข้อความระหว่าง
    let title='';
    const qm=p.slice(ls,le+1).match(/"([^"]+)"/);
    if(qm)title=qm[1].trim();
    if(!title){
      const tm=mid.replace(/\[.*?\)/g,'').trim().match(/^[\d.\s]*([^[\]]{3,80})/);
      if(tm)title=tm[1].trim();
    }
    if(!title||/^Image\s*\d*$/i.test(title))title=link.split('/').pop();
    out.push({title,cover,link,genreInline:gm?gm[1].toLowerCase():''});
  }
  return out;
}
function genreOf(md,link){
  // หาบรรทัด genre ใต้การ์ด (เช่น [Action](.../genre/action/), [Manhwa](...))
  const i=md.indexOf(link);
  if(i<0)return '';
  const seg=md.slice(i,i+1200);
  const gs=[...seg.matchAll(/\[([A-Za-zก-๙ ]+)\]\(https:[^)]+\/genre\/([^)]+?)\)/g)].map(x=>x[2].toLowerCase());
  return gs.join(' ');
}
function originBadge(g){
  if(g.includes('manhwa'))return '🇰🇷 เกาหลี';
  if(g.includes('manhua'))return '🇨🇳 จีน';
  if(g.includes('manga'))return '🇯🇵 ญี่ปุ่น';
  return '🌏 รวม';
}
function updateCats(){
  const src=$('src').value,sel=$('cat');
  sel.innerHTML=CATS[src].map((c,i)=>`<option value="${i}">${c.t}</option>`).join('');
}
function catUrl(){
  const src=$('src').value;
  const c=CATS[src][+$('cat').value||0]||CATS[src][0];
  return {url:base()+c.u,label:c.t};
}
function pageUrl(baseUrl,page,query){
  // ทุกเว็บใช้ /page/N/ ต่อท้าย; ค้นหา WP ใช้ ?s= + /page/N/ (LC ต้องมี post_type=wp-manga)
  if(query){
    const extra=baseUrl.includes('manga-lc.net')?'&post_type=wp-manga':'';
    return baseUrl+(page>1?'page/'+page+'/':'')+'?s='+encodeURIComponent(query)+extra;
  }
  return baseUrl+(page>1?'page/'+page+'/':'');
}
function maxPageOf(html,baseUrl){
  // หาเลขหน้าสูงสุดจากลิงก์ pagination (เช่น /page/244/)
  // slug ไทยใน HTML เป็น percent-encoded — ลองทั้งดิบและ encode
  let mx=1;
  for(const v of [baseUrl,encodeURI(baseUrl)]){
    const esc=v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp(esc+'[^"\\s<>]*page/(\\d+)/?','gi');
    let m;while((m=re.exec(html))){const n=+m[1];if(n>mx)mx=n}
  }
  return mx;
}
function syncPager(page,max){
  const p=$('pager');p.style.display='';
  const sub=window._sub||0,subs=window._subs||1;
  const shown=document.querySelectorAll('#list .card').length;
  const a=window._siteFirst||page,b=window._siteLast||page;
  // บรรทัดเดียว: แสดง N เรื่อง — อยู่หน้าเว็บไหน / ทั้งหมดกี่หน้า
  let t='แสดง '+shown+' เรื่อง — หน้าเว็บ '+a+(b>a?'-'+b:'');
  if(max>1)t+=' / ทั้งหมด ~'+max+' หน้า (~'+(max*10)+'+ เรื่อง)';
  if(subs>1)t+=' (ชุด '+(sub+1)+'/'+subs+')';
  $('pgInfo').textContent=t;
  $('pgPrev').disabled=(page<=1&&sub<=0);
  $('pgNext').disabled=(page>=max&&sub>=subs-1);
}
function pgGo(dir){
  const sub=window._sub||0,subs=window._subs||1,page=window._page||1,mode=window._mode||'pop';
  if(dir>0){
    if(sub<subs-1){ // หน้าถัดไปใน 25 เรื่องชุดเดิม
      window._sub=sub+1;
      renderCards(window._items.slice((sub+1)*PAGE_SIZE,(sub+1)*PAGE_SIZE+PAGE_SIZE));
      syncPager(page,window._maxPage||1);window.scrollTo(0,0);return;
    }
    runSearchOrPop(mode,(window._siteLast||page)+1);
  }else{
    if(sub>0){
      window._sub=sub-1;
      renderCards(window._items.slice((sub-1)*PAGE_SIZE,(sub-1)*PAGE_SIZE+PAGE_SIZE));
      syncPager(page,window._maxPage||1);window.scrollTo(0,0);return;
    }
    if((window._siteFirst||page)>1)runSearchOrPop(mode,(window._siteFirst||page)-1);
  }
}
async function runSearchOrPop(mode,page){
  const b=base(),src=$('src').value;
  if(page===undefined)page=1;
  window._page=page;window._mode=mode;
  // ทุกแหล่งผ่าน worker (static 100% — ไม่ต้องมีเซิร์ฟเวอร์ของเรา)
  try{
    let html,items=[],badge='',max=1;
    // ดึงหลาย site-page สะสมให้ครบ 25 เรื่อง (บางเว็บให้แค่หน้าละ 10)
    const parseOne=(h)=>{
      if(src==='oremanga'){
        const cat=CATS.oremanga[+$('cat').value||0]||{};
        let it=(cat.list?parseOreList(h,b):parseOreCards(h,b,badge));
        return {it,once:!!cat.list};
      }
      else if(src==='dark'){
        let it=parseDarkCards(h,b).map(x=>({...x,badge}));
          return {it};
      }
      let it=parseLcCards(h,b).map(x=>({...x,badge}));
      return {it};
    };
    if(mode==='pop'){
      const c=catUrl();badge=c.label;
      const cat=CATS[$('src').value][+$('cat').value||0]||{};
      const effPage=cat.list?1:page; // manga-list A-Z อยู่หน้าเดียวทั้งหมด
      status('กำลังโหลด ['+c.label+'] หน้า '+effPage+' ...');
      html=await viaWorker(pageUrl(c.url,effPage,''));
      max=cat.list?1:Math.max(maxPageOf(html,c.url),page);
      items=parseOne(html).it;
      // สะสมหน้าถัดไปจนครบ 25 (ไม่เกิน 4 หน้า)
      let p=effPage;
      while(items.length<PAGE_SIZE&&!cat.list&&p<max&&p-effPage<3){
        p++;
        status('กำลังโหลด ['+badge+'] (สะสม '+items.length+' เรื่อง — หน้าเว็บ '+p+'/'+max+') ...');
        try{
          const h2=await viaWorker(pageUrl(c.url,p,''));
          const more=parseOne(h2).it.filter(x=>!items.some(y=>y.link===x.link));
          items=items.concat(more);
          window._accPages=p-effPage+1;
        }catch(e){break}
      }
      window._fetched=items.length;
    }else{
      const q=$('q').value.trim();
      if(!q)return status('พิมพ์ชื่อเรื่องก่อน');
      status('กำลังค้นหา "'+q+'" หน้า '+page+' ...');
      html=await viaWorker(pageUrl(b+'/',page,q));
      if(isChallenge(html)&&src==='dark'){
        // ค้น Dark โดน Cloudflare กันบอททุกช่องทาง — ให้ browse หมวดแทน
        status('ค้น Dark ไม่ได้ (เว็บกันบอท) — เลือกหมวดด้านบน browse แทน');
        $('list').innerHTML='<p>🔍 ค้น "'+q+'" ใน Dark-Manga ไม่ได้ (เว็บกันบอท)<br>ให้เลือกหมวด (Action/Fantasy/…) ด้านบน browse แทน หรือค้นที่ Oremanga / Manga-LC</p>';
        return;
      }
      badge='🔍 ค้นหา';max=Math.max(maxPageOf(html,b+'/'),page);
      items=parseOne(html).it;
      let p=page;
      while(items.length<PAGE_SIZE&&p<max&&p-page<3){
        p++;
        try{
          const h2=await viaWorker(pageUrl(b+'/',p,q));
          const more=parseOne(h2).it.filter(x=>!items.some(y=>y.link===x.link));
          items=items.concat(more);
          window._accPages=p-page+1;
        }catch(e){break}
      }
      window._fetched=items.length;
    }
    if(!items.length){$('list').innerHTML='<p>ไม่เจอเรื่อง (ลองเปลี่ยนเว็บ/หมวด หรือคำค้น)</p>';status('ไม่เจอ — ลองเปลี่ยนเว็บ/หมวด/คำค้น');return}
    // แบ่งแสดงหน้าละ 25 เรื่อง (sub-page ในเว็บเพจเดียวกัน)
    window._items=items;window._maxPage=max;window._badge=badge;
    const subs=Math.max(1,Math.ceil(items.length/PAGE_SIZE));
    let sub=0;
    // จำ site-page ที่ดึงไปแล้ว (สะสมหลายหน้า) — ปุ่ม pager ข้ามไปหน้าที่ถูกต้อง
    window._siteFirst=page;window._siteLast=(window._accPages?(page+window._accPages-1):page);window._accPages=0;
    status(badge+' — เจอ '+items.length+' เรื่อง (แตะปกเพื่ออ่าน)');
    renderCards(items.slice(sub*PAGE_SIZE,sub*PAGE_SIZE+PAGE_SIZE));
    window._sub=sub;window._subs=subs;
    syncPager(page,max);
    window.scrollTo(0,0);
  }catch(e){
    if(mode==='search'&&src==='dark'&&/403/.test(e.message)){
      status('ค้น Dark ไม่ได้ (เว็บกันบอท) — เลือกหมวด browse แทน');
      $('list').innerHTML='<p>🔍 ค้นใน Dark-Manga ไม่ได้ (เว็บกันบอท)<br>ให้เลือกหมวดด้านบน browse แทน หรือค้นที่ Oremanga / Manga-LC</p>';
      return;
    }
    status('โหลดไม่ได้: '+e.message+' — ลองกดอีกครั้ง')
  }
}
function renderCards(items){
  const el=$('list');el.innerHTML='';$('chapters').innerHTML='';
  for(const c of items){
    const d=document.createElement('div');d.className='card';
    const pic=c.cover?`<img loading="lazy" src="${c.cover}" referrerpolicy="no-referrer" ${IMGERR}>`:`<div style="height:80px;display:flex;align-items:center;justify-content:center;background:#222;font-size:40px">📖</div>`;
    d.innerHTML=pic+`<div><span class="badge">${c.badge}</span><span class="src">${$('src').value}</span><br>${c.title}</div>`;
    d.onclick=()=>openSeries(c.link,c.title);
    el.appendChild(d);
  }
}
async function openSeries(link,title){
  const b=base(),src=$('src').value;
  // worker sources: สารบัญจาก raw HTML
  if(src==='dark'||src==='lc'||src==='oremanga'){
    status('กำลังเปิด "'+title+'" ...');
    let found=[];
    try{
      const html=await viaWorker(link+'/');
      const slug=link.split('/').pop();
      if(src==='dark')found=parseDarkChapters(html,b);
      else if(src==='lc')found=parseLcChapters(html,b,slug);
      else found=parseOreChapters(html,slug);
      const num=u=>{const m=u.match(/(\d+)\/?$/);return m?+m[1]:-1};
      found.sort((a,c)=>num(c)-num(a));
    }catch(e){$('chapters').innerHTML=`<h3>${title}</h3><p>เปิดไม่ได้: ${e.message}</p><a target="_blank" rel="noopener" href="${link}/"><button>เปิดที่เว็บต้นทาง</button></a>`;return}
    if(!found.length){$('chapters').innerHTML=`<h3>${title}</h3><p>ไม่เจอสารบัญ — <a target="_blank" rel="noopener" href="${link}/"><button>เปิดที่เว็บต้นทาง</button></a></p>`;status('ไม่เจอตอน');return}
    window._feed=found;window._title=title;
    $('chapters').innerHTML=`<h3>${title} — ${found.length} ตอน (แตะเพื่ออ่าน ไม่มีโฆษณา)</h3>`+
      found.map((u,i)=>{const m=u.match(/(\d+)\/?$/);return `<button data-ch="${i}">ตอนที่ ${m?m[1]:'?'}</button>`}).join('')+
      `<div style="margin-top:8px"><a target="_blank" rel="noopener" href="${link}/"><button>เปิดที่เว็บต้นทาง</button></a></div>`;
    $('chapters').querySelectorAll('button[data-ch]').forEach(x=>x.onclick=()=>openChapter(+x.dataset.ch));
    openChapter(0);
    return;
  }
  const slug=link.split('/').pop();
  status('กำลังเปิด "'+title+'" ...');
  try{
    const md=await viaJina(link+'/');
    // หาลิงก์ตอน: /<slug>/<slug>-N/
    const re=new RegExp('https?://[^)\\s]+?/'+slug.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-'+'[^)\\s/]*/?','g');
    const found=[...new Set([...md.matchAll(re)].map(x=>x[0].replace(/\/$/,'')))];
    // เรียงตามเลขตอน
    const num=u=>{const m=u.match(/-(\d+)\/?$/);return m?+m[1]:-1};
    found.sort((a,c)=>num(c)-num(a));
    if(!found.length){$('chapters').innerHTML=`<h3>${title}</h3><p>ไม่เจอสารบัญ — <a target="_blank" rel="noopener" href="${link}/"><button>เปิดที่เว็บต้นทาง</button></a></p>`;status('ไม่เจอตอน');return}
    window._feed=found;window._title=title;
    $('chapters').innerHTML=`<h3>${title} — ${found.length} ตอน (แตะเพื่ออ่าน ไม่มีโฆษณา)</h3>`+
      found.map((u,i)=>{const m=u.match(/-(\d+)\/?$/);return `<button data-ch="${i}">ตอนที่ ${m?m[1]:'?'}</button>`}).join('')+
      `<div style="margin-top:8px"><a target="_blank" rel="noopener" href="${link}/"><button>เปิดที่เว็บต้นทาง</button></a></div>`;
    $('chapters').querySelectorAll('button[data-ch]').forEach(x=>x.onclick=()=>openChapter(+x.dataset.ch));
    openChapter(0);
  }catch(e){$('chapters').innerHTML=`<h3>${title}</h3><p>เปิดไม่ได้: ${e.message}</p><a target="_blank" rel="noopener" href="${link}/"><button>เปิดที่เว็บต้นทาง</button></a>`}
}
async function openChapter(i){
  const u=window._feed[i];window._idx=i;
  const box=$('reader');box.innerHTML='กำลังโหลดภาพ...';
  window.scrollTo(0,box.getBoundingClientRect().top+window.scrollY);
  try{
    status('กำลังโหลดภาพตอน...');
    const src=$('src').value;
    let imgs=[];
    if(src==='dark'){
      const html=await viaWorker(u+'/');
      imgs=parseDarkImages(html);
    }else if(src==='lc'){
      const html=await viaWorker(u+'/');
      imgs=parseLcImages(html);
    }else{
    const html=await viaWorker(u+'/');
    imgs=parseOreImages(html);
    } // end else (oremanga via worker)
    if(!imgs.length){
      // ตอนว่างที่ต้นทาง (เช่น LC บางตอน) — ข้ามไปตอนถัดไปอัตโนมัติ ไม่เกิน 5 ตอน
      const tried=(window._skipTried||0)+1;window._skipTried=tried;
      if(tried<=5&&i+1<window._feed.length){
        status('ตอนนี้ว่างที่ต้นทาง — ข้ามไปตอนถัดไป...');
        return openChapter(i+1);
      }
      window._skipTried=0;
      throw new Error(src==='lc'?'เว็บนี้โหลดภาพด้วยสคริปต์ — กดปุ่ม "เปิดที่เว็บต้นทาง" อ่านแทน':'ไม่มีภาพในตอนนี้');
    }
    window._skipTried=0;
    const m0=u.match(/(\d+)\/?$/);
    box.innerHTML=`<div style="text-align:center;padding:4px;color:#888;font-size:12px">ตอนที่ ${m0?m0[1]:''} (${i+1}/${window._feed.length}) — ใช้แถบล่างเลื่อนตอน</div>`+
      imgs.map((s,index)=>imgTag(s,index===0?'eager':'lazy')).join('');
    syncFloat(i);
    status('โหลดภาพสำเร็จ: '+imgs.length+' หน้า (บล็อกโฆษณาแล้ว)');
    $('btnBack').style.display='';
    window.scrollTo(0,box.getBoundingClientRect().top+window.scrollY);
  }catch(e){box.innerHTML='โหลดภาพไม่ได้: '+e.message+' <a target="_blank" rel="noopener" href="'+u+'/"><button>เปิดที่เว็บต้นทาง</button></a>';status('อ่านไม่ได้: '+e.message)}
}
function syncFloat(i){
  // แถบลอยล่างจอ: เห็นและกดได้เสมอแม้เลื่อนลงลึก
  document.body.classList.add('reading');
  const fn=$('floatNav');fn.style.display='block';
  $('fPrev').disabled=i>=window._feed.length-1;
  $('fNext').disabled=i<=0;
  $('fSel').innerHTML=window._feed.map((u2,j)=>{const m2=u2.match(/-(\d+)\/?$/);return `<option value="${j}"${j===i?' selected':''}>ตอนที่ ${m2?m2[1]:j+1} (${j+1}/${window._feed.length})</option>`}).join('');
  $('fSel').value=String(i);
}
$('fSel').onchange=e=>openChapter(+e.target.value);
$('fPrev').onclick=()=>{if(window._idx<window._feed.length-1)openChapter(window._idx+1)};
$('fNext').onclick=()=>{if(window._idx>0)openChapter(window._idx-1)};
$('fTop').onclick=()=>window.scrollTo({top:$('reader').getBoundingClientRect().top+window.scrollY,behavior:'smooth'});
$('pgPrev').onclick=()=>pgGo(-1);
$('pgNext').onclick=()=>pgGo(1);
$('fHome').onclick=()=>goHome();
$('btnSearch').onclick=()=>runSearchOrPop('search');
$('btnPop').onclick=()=>runSearchOrPop('pop');
function goHome(){$('reader').innerHTML='';$('btnBack').style.display='none';$('floatNav').style.display='none';document.body.classList.remove('reading');runSearchOrPop('pop');window.scrollTo(0,0)}
$('btnHome').onclick=goHome;
$('homeLink').onclick=e=>{e.preventDefault();goHome()};
$('btnBack').onclick=()=>{$('reader').innerHTML='';$('chapters').scrollIntoView()};
$('q').onkeydown=e=>{if(e.key==='Enter')runSearchOrPop('search')};
$('src').onchange=()=>{updateCats();runSearchOrPop('pop')};
$('cat').onchange=()=>runSearchOrPop('pop');
updateCats();runSearchOrPop('pop');
</script></body></html>
